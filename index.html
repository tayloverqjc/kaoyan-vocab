<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考研英语阅读精装词本 · Lexicon</title>
  <meta name="description" content="考研英语真题阅读核心生词本：精装书房排版、真题详细用法、词根联想记忆、模糊遮义自测与 3D 物理闪卡。" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <script>
    (function(){try{var t=localStorage.getItem("kaoyan_vocab_theme_v1");if(t==="light")t="paper";if(["mono","glass","momo","dark"].indexOf(t)>=0)document.documentElement.setAttribute("data-theme",t);var w=localStorage.getItem("kaoyan_vocab_wallpaper_v1");if(["alpine","sunset","forest"].indexOf(w)>=0)document.documentElement.setAttribute("data-wallpaper",w);}catch(e){}})();
  </script>
</head>
<body>
  <!-- Mobile Sticky Header -->
  <div class="mobile-bar">
    <button type="button" class="mobile-menu-btn" id="mobileMenuBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
      <span>目录</span>
      <span class="mobile-pct-pill" id="mobilePct">0%</span>
    </button>
    <div class="view-seg" role="tablist">
      <button type="button" class="view-btn active" data-view="cards">精读</button>
      <button type="button" class="view-btn" data-view="ledger">速刷</button>
      <button type="button" class="view-btn" data-view="deck">闪卡</button>
    </div>
  </div>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <div class="studio">
    <!-- Left Study Rail -->
    <aside class="sidebar" id="sidebar">
      <div class="masthead">
        <div class="masthead-kicker">Lexicon · Reading Archive</div>
        <h1 class="masthead-title">考研英语精装词本</h1>
        <p class="masthead-desc">真题语境精读 · 词根画面记忆</p>
      </div>

      <div class="ring-card" aria-label="掌握进度">
        <div class="ring-wrap">
          <svg class="ring-svg" width="68" height="68" viewBox="0 0 68 68">
            <circle class="ring-bg" cx="34" cy="34" r="28"></circle>
            <circle class="ring-fg" id="ringFg" cx="34" cy="34" r="28"></circle>
          </svg>
          <div class="ring-center">
            <span class="ring-pct" id="ringPct">0%</span>
          </div>
        </div>
        <div class="ring-stats">
          <span class="c-pine">已掌握 <strong id="statMastered">0</strong> / <strong id="statTotal">84</strong></span>
          <span>待攻克 <strong id="statRemain">84</strong> 词</span>
          <span class="c-verm">易忘钉子户 <strong id="statHard">0</strong></span>
        </div>
      </div>

      <div>
        <div class="side-section-label">年份词卷</div>
        <div class="set-pills" id="yearList"></div>
      </div>

      <div>
        <div class="side-section-label">篇目章节</div>
        <nav class="side-list" id="chapterList"></nav>
      </div>

      <div>
        <div class="side-section-label">智能筛选</div>
        <div class="side-list" id="collectionList"></div>
      </div>

      <div>
        <div class="side-section-label">主题风格</div>
        <div class="theme-grid" id="themeGrid" role="radiogroup" aria-label="主题风格"></div>
        <div class="wp-section">
          <div class="side-section-label" style="margin-top:10px">氛围壁纸</div>
          <div class="wp-grid" id="wpGrid" role="radiogroup" aria-label="氛围壁纸"></div>
        </div>
      </div>

      <div class="side-footer">
        <button type="button" class="side-foot-btn" id="syncBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          <span>同步 / 备份进度</span>
        </button>
      </div>
    </aside>

    <!-- Right Main Reading Stage -->
    <main class="stage">
      <header class="stage-header">
        <div>
          <div class="stage-kicker" id="stageKicker">2012 英语（二）阅读</div>
          <h2 class="stage-title" id="stageTitle">全部篇目</h2>
        </div>

        <div class="stage-controls">
          <div class="view-seg" role="tablist" aria-label="视图切换">
            <button type="button" class="view-btn active" data-view="cards">精读卡</button>
            <button type="button" class="view-btn" data-view="ledger">速刷表</button>
            <button type="button" class="view-btn" data-view="deck">3D 闪卡</button>
          </div>

          <div class="search-field">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="searchInput" class="search-input" type="search" placeholder="搜单词、词义、原句..." />
          </div>

          <button type="button" class="mask-btn" id="maskBtn"></button>

          <div class="wp-pill" id="wpPill" role="radiogroup" aria-label="切换氛围壁纸"></div>

          <div class="theme-dots" id="themeDots" role="radiogroup" aria-label="快捷切换主题"></div>
        </div>
      </header>

      <div id="stageContent"></div>
    </main>
  </div>

  <!-- Sync Progress Modal -->
  <div class="modal-bg" id="syncModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <h3 style="margin:0;font-size:16px">同步学习进度</h3>
        <button type="button" class="foot-btn" id="closeSyncBtn">关闭</button>
      </div>
      <p style="margin:0;font-size:12.5px;color:var(--text-muted)">你的掌握与易忘记录保存在当前浏览器本地。切换手机/电脑时，复制进度码粘贴导入即可。</p>
      <textarea id="syncArea" class="sync-area" spellcheck="false"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <button type="button" class="foot-btn" id="resetProgressBtn">重置进度</button>
        <div style="display:flex;gap:8px">
          <button type="button" class="mask-btn" style="height:34px" id="copySyncBtn">复制进度码</button>
          <button type="button" class="ink-btn" style="height:34px;padding:0 16px;font-size:13px" id="importSyncBtn">导入覆盖</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/manifest.js"></script>
  <script src="data/2012.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
