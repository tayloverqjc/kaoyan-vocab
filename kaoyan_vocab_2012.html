<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考研英语阅读生词记忆本 · 2012 英二</title>
  <meta name="description" content="考研英语真题阅读核心生词本：支持真题详细用法、词根联想记忆、遮义自测、闪卡刷词与进度保存。" />
  <style>
    :root{--bg:#f7f4ee;--surface:#fff;--surface-subtle:#f2eee6;--surface-memory:#f4f7f5;--border:#e5dfd3;--border-strong:#d4cbb9;--text:#1c1917;--text-secondary:#57534e;--text-muted:#78716c;--primary:#1f6b57;--primary-hover:#175444;--primary-soft:#e6f2ee;--amber:#b8621b;--amber-soft:#fdf2e6;--danger:#b83b3b;--danger-soft:#fcecec;--code-bg:#f3efe7;--code-text:#1f5c4b;--shadow-sm:0 1px 2px rgba(28,25,23,.05);--shadow-md:0 6px 20px rgba(28,25,23,.06);--r-sm:8px;--r-md:12px;--r-lg:16px}
    [data-theme="dark"]{--bg:#141618;--surface:#1c1f22;--surface-subtle:#23272b;--surface-memory:#1a2623;--border:#2e3338;--border-strong:#3e454c;--text:#eceae5;--text-secondary:#b5b0a6;--text-muted:#8a857c;--primary:#46a88c;--primary-hover:#58ba9e;--primary-soft:#1b312b;--amber:#e2964c;--amber-soft:#31251a;--danger:#e06c6c;--danger-soft:#311d1d;--code-bg:#262b30;--code-text:#72cbb1;--shadow-sm:0 1px 2px rgba(0,0,0,.25);--shadow-md:0 8px 24px rgba(0,0,0,.35)}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px;min-height:100vh;transition:background-color .2s,color .2s}
    button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
    .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .topbar-inner{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0}
    .brand-title{margin:0;font-size:16px;font-weight:700;line-height:1.25}
    .brand-sub{margin:0;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:34px;padding:0 11px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:13px;font-weight:500;transition:all .15s}
    .icon-btn:hover{border-color:var(--primary);color:var(--text)}
    .container{max-width:960px;margin:0 auto;padding:18px 16px 72px}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-sm);margin-bottom:16px}
    .overview-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .set-switcher{display:flex;flex-wrap:wrap;gap:8px}
    .set-pill{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--primary);background:var(--primary);color:#fff}
    .mode-switch{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-subtle);border:1px solid var(--border)}
    .mode-btn{padding:5px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-secondary);transition:all .15s}
    .mode-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
    .progress-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:8px}
    .progress-stats{display:flex;flex-wrap:wrap;gap:14px;color:var(--text-secondary)}
    .progress-stats strong{color:var(--text);font-variant-numeric:tabular-nums}
    .stat-m strong{color:var(--primary)}.stat-h strong{color:var(--amber)}
    .bar-track{width:100%;height:7px;border-radius:999px;background:var(--surface-subtle);overflow:hidden}
    .bar-fill{height:100%;background:var(--primary);border-radius:999px;width:0;transition:width .3s}
    .controls{display:flex;flex-direction:column;gap:12px}
    .tabs-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.tabs-scroll::-webkit-scrollbar{display:none}
    .tab-btn{white-space:nowrap;padding:6px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--text-secondary);background:var(--surface-subtle);border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
    .tab-btn.active{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 35%,transparent);font-weight:600}
    .toolbar-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
    .filter-group,.study-toggles{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
    .chip-btn{padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--text-secondary);border:1px solid var(--border);background:var(--surface);transition:all .15s}
    .chip-btn.active{background:var(--text);border-color:var(--text);color:var(--bg)}
    .chip-btn.amber.active{background:var(--amber);border-color:var(--amber);color:#fff}
    .search-box{position:relative;flex:1 1 170px;max-width:230px}
    .search-input{width:100%;height:34px;padding:0 10px 0 30px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);font-size:13px;outline:none}
    .search-input:focus{border-color:var(--primary)}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none}
    .toggle-btn{height:34px;padding:0 11px;border-radius:var(--r-sm);font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);transition:all .15s}
    .toggle-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .passage-section{margin-bottom:24px}
    .passage-header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 10px;margin-bottom:12px;border-bottom:1px solid var(--border)}
    .passage-title{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
    .passage-code{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-subtle);color:var(--text-secondary)}
    .passage-meta{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
    .word-list{display:flex;flex-direction:column;gap:12px}
    .word-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow-sm);transition:all .15s}
    .word-card.is-mastered{opacity:.66}
    .word-card.is-hard{border-color:color-mix(in srgb,var(--amber) 45%,var(--border))}
    .card-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
    .word-identity{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 10px}
    .word-text{font-family:Georgia,"Times New Roman","PingFang SC",serif;font-size:22px;font-weight:700;line-height:1.2}
    .word-ipa{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--text-muted)}
    .speak-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;background:var(--surface-subtle);color:var(--text-secondary);font-size:13px}
    .speak-btn:hover{background:var(--primary-soft);color:var(--primary)}
    .badge-sec{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
    .card-actions{display:flex;gap:6px}
    .action-pill{height:30px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary)}
    .action-pill.hard-active{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 40%,transparent);color:var(--amber);font-weight:600}
    .action-pill.master-active{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 40%,transparent);color:var(--primary);font-weight:600}
    .meaning-box{padding:9px 12px;border-radius:var(--r-sm);background:var(--surface-subtle);font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .meaning-box.masked{cursor:pointer;user-select:none;color:var(--text-muted);font-weight:500;font-size:13.5px;border:1px dashed var(--border-strong);background:var(--bg)}
    .pos-tag{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;color:var(--primary);margin-right:4px}
    .card-details{display:grid;grid-template-columns:1fr;gap:10px}
    @media(min-width:720px){.card-details{grid-template-columns:1.25fr 1fr}}
    .detail-block{padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);font-size:13.5px;line-height:1.7;color:var(--text-secondary)}
    .detail-block.memory{background:var(--surface-memory);border-color:color-mix(in srgb,var(--primary) 18%,var(--border))}
    .detail-label{display:block;font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:4px}
    .detail-block.memory .detail-label{color:var(--primary)}
    .inline-en{font-size:13px;padding:1px 5px;border-radius:5px;background:var(--code-bg);color:var(--code-text);font-weight:500;word-break:break-word}
    .details-hidden .card-details{display:none}
    .flashcard-wrap{max-width:640px;margin:0 auto}
    .fc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:13px;color:var(--text-secondary)}
    .flashcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px 22px;box-shadow:var(--shadow-md);min-height:290px;display:flex;flex-direction:column;justify-content:space-between}
    .fc-front{text-align:center;padding:20px 0 14px}
    .fc-passage{font-size:12px;color:var(--text-muted);margin-bottom:12px}
    .fc-word{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:700;margin:0 0 8px}
    .fc-ipa-row{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px}
    .fc-hint-btn,.btn-primary{display:inline-flex;align-items:center;justify-content:center;padding:9px 20px;border-radius:999px;background:var(--primary);color:#fff;font-size:14px;font-weight:600}
    .btn-primary{border-radius:var(--r-sm);padding:8px 16px;font-size:13.5px}
    .fc-back{border-top:1px solid var(--border);padding-top:16px;margin-top:10px;display:flex;flex-direction:column;gap:12px}
    .fc-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
    .fc-rate-btn{padding:11px 8px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;border:1px solid var(--border)}
    .fc-rate-btn.forgot{color:var(--danger);background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
    .fc-rate-btn.fuzzy{color:var(--amber);background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
    .fc-rate-btn.know{color:var(--primary);background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
    .fc-kbd{text-align:center;font-size:12px;color:var(--text-muted);margin-top:12px}
    .empty-state{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:42px 20px;text-align:center;color:var(--text-secondary)}
    .modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
    .modal-backdrop.open{display:flex}
    .modal-card{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-md)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .sync-textarea{width:100%;min-height:105px;padding:10px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-bottom:12px}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:60}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .hidden{display:none!important}
    @media(max-width:560px){.brand-sub{display:none}.container{padding:14px 12px 64px}.panel,.word-card{padding:14px}.word-text{font-size:20px}.fc-word{font-size:28px}.search-box{max-width:none;flex-basis:100%}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">词</div>
        <div>
          <h1 class="brand-title">考研英语阅读生词本</h1>
          <p class="brand-sub">真题详细用法 · 词根联想记忆 · 随时翻看自测</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="syncBtn">⇅ 同步进度</button>
        <button type="button" class="icon-btn" id="themeBtn">☾ 夜间</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="overview-top">
        <div class="set-switcher"><span class="set-pill">2012 英二阅读 (84)</span></div>
        <div class="mode-switch">
          <button type="button" class="mode-btn active" id="modeListBtn">📖 精读列表</button>
          <button type="button" class="mode-btn" id="modeFlashBtn">🗂 闪卡刷词</button>
        </div>
      </div>
      <div class="progress-row">
        <div class="progress-stats">
          <span>总计 <strong id="statTotal">84</strong></span>
          <span class="stat-m">已掌握 <strong id="statMastered">0</strong></span>
          <span>待攻克 <strong id="statRemain">84</strong></span>
          <span class="stat-h">★ 易忘 <strong id="statHard">0</strong></span>
        </div>
        <strong id="progressPct">0%</strong>
      </div>
      <div class="bar-track"><div class="bar-fill" id="progressBarFill"></div></div>
    </section>

    <section class="panel controls">
      <div id="passageTabs" class="tabs-scroll"></div>
      <div class="toolbar-row">
        <div class="filter-group">
          <button type="button" class="chip-btn active" data-status="all">全部</button>
          <button type="button" class="chip-btn" data-status="unmastered">未掌握</button>
          <button type="button" class="chip-btn amber" data-status="hard">★ 易忘</button>
          <button type="button" class="chip-btn" data-status="mastered">✓ 已掌握</button>
          <button type="button" class="chip-btn amber" id="secondaryBtn">⭐ 仅熟词生义</button>
        </div>
        <div class="study-toggles">
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input id="searchInput" class="search-input" type="search" placeholder="搜单词、词义或搭配..." />
          </div>
          <button type="button" class="toggle-btn" id="maskBtn">🙈 遮住词义自测</button>
          <button type="button" class="toggle-btn" id="compactBtn">精简刷词视图</button>
        </div>
      </div>
    </section>

    <div id="mainContent"></div>
  </main>

  <div class="modal-backdrop" id="syncModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 style="margin:0;font-size:16px">同步学习进度（手机 ↔ 电脑）</h2>
        <button type="button" class="icon-btn" id="closeSyncBtn">关闭</button>
      </div>
      <p style="margin:0 0 12px;font-size:13px;color:var(--text-muted)">进度默认存在当前浏览器本地。换设备时复制下方进度码粘贴导入即可。</p>
      <textarea id="syncTextarea" class="sync-textarea" spellcheck="false"></textarea>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px">
        <button type="button" class="icon-btn" id="resetProgressBtn">重置进度</button>
        <div style="display:flex;gap:8px">
          <button type="button" class="icon-btn" id="copySyncBtn">复制进度码</button>
          <button type="button" class="btn-primary" id="importSyncBtn">导入覆盖</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const VOCAB_DATA = {
      passages: [
        {
          id: "T1", code: "Text 1", title: "作业新政",
          words: [
            {id:"2012-T1-1",word:"scorn",ipa:"/skɔːn/",meaning:"`v.` 鄙视；痛批；轻蔑",usage:"`be particularly scorned`（尤其受到痛批）。原文：`in recent years it has been particularly scorned.` 本词既是作者切入“作业不受待见”的线索词，也常以形容词 `scornful`（鄙视的）出现在态度题选项中（如同年 Text 3 第 35 题 C）。",memory:"谐音画面：**“死磕嗯”**——对着别人“死磕”不顺眼，就是**鄙视、嘲讽、痛批**；也可联想 `scar`（伤疤），用话戳人伤疤＝嘲弄鄙视。",secondary:false},
            {id:"2012-T1-2",word:"revise",ipa:"/rɪˈvaɪz/",meaning:"`v.` 修正；重新审视并调整",usage:"`revise one’s thinking on sth.`（调整对某事的看法）。原文：`are revising their thinking on this educational ritual.` 考研中不仅指“修改文章/修订法律”，常考“反思并改变政策或观念”。",memory:"词根：`re-`（再、重新）+ `vis`（看，同 `visible` 可见的）→ **再看一遍去修改、调整看法**。",secondary:false},
            {id:"2012-T1-3",word:"ritual",ipa:"/ˈrɪtʃuəl/",meaning:"`n.` 惯例；例行公事；仪式",usage:"`educational ritual`（教育界沿袭已久的惯例）。原文用它指代 `homework`，带有一点“大家习以为常却未必反思其合理性”的意味。",memory:"联想：`rit` 像 `rite`（仪式）→ 每天固定重复像做仪式一样的事情＝**例行公事、惯例**。",secondary:false},
            {id:"2012-T1-4",word:"inflexible",ipa:"/ɪnˈfleksəbl/",meaning:"`adj.` 僵化的；死板的；不可变通的",usage:"`produce an inflexible policy`（出台一项死板的政策）。出现在第 1 段 `Unfortunately` 之后，直接定下作者对该政策**否定批判**的基调，对应第 25 题标题里的 `Faulty`。",memory:"词根：`in-`（不）+ `flex`（弯曲，同 `flexible` 灵活的）+ `-ible`（能……的）→ **弯不动的 → 死板僵化的**。",secondary:false},
            {id:"2012-T1-5",word:"mandate",ipa:"/ˈmændeɪt/",meaning:"`v.` 强制规定；明令要求",usage:"`mandate that...`（明文规定……，后接从句）。原文：`policy which mandates that... homework may no longer count for more than 10%...` 常见作名词表“命令、授权、任期”。",memory:"词根：`man`（手，同 `manual` 手工）+ `date`（给）→ 亲手交办下来的硬任务 → **命令、强制规定**。",secondary:false},
            {id:"2012-T1-6",word:"count for",ipa:"/kaʊnt fɔː/",meaning:"`v. phr.` 占……比重；有价值，重要",usage:"⭐**熟词生义**：1. 原文 `count for more than 10% of a student’s academic grade`（在学业成绩中**占比**超过 10%）；2. 第 24 题选项 B `counts much in schooling`（在学校教育中**很重要**，同义替换文中的 `matters`）。",memory:"逻辑延伸：数数时能算得上数（`count`）→ 才有分量 → **占比重 / 很重要**。记住 `Every minute counts`（分秒必争）。",secondary:true},
            {id:"2012-T1-7",word:"impoverished",ipa:"/ɪmˈpɒvərɪʃt/",meaning:"`adj.` 贫困的；穷困的",usage:"`students from impoverished or chaotic homes`（来自贫困或混乱家庭的学生）。第 22 题题干直接同义改写为 `poor students`。",memory:"词族：中间的 `pover` 就是 **`poverty`（贫穷）**！`im-`（使进入）+ `poverty` + `-ish` → **陷入贫穷的**。",secondary:false},
            {id:"2012-T1-8",word:"chaotic",ipa:"/keɪˈɒtɪk/",meaning:"`adj.` 混乱的；无序的",usage:"`chaotic homes`（混乱失序的家庭环境）。与 `impoverished` 并列，解释为什么有些学生回家根本没条件写作业。",memory:"词族：来自名词 **`chaos`** `/ˈkeɪɒs/`（大混乱），加 `-tic` 变成形容词；谐音“吵死”，家里吵死＝**混乱的**。",secondary:false},
            {id:"2012-T1-9",word:"contradictory",ipa:"/ˌkɒntrəˈdɪktəri/",meaning:"`adj.` 自相矛盾的；对立的",usage:"`be unclear and contradictory`（含糊且自相矛盾）。原文第 2 段转折句核心评价词，直接否定该政策的逻辑自洽性。",memory:"词根：`contra-`（反、对着）+ `dict`（说，同 `dictionary`）→ **反着说 → 自相矛盾的**。",secondary:false},
            {id:"2012-T1-10",word:"give a pass",ipa:"/ɡɪv ə pɑːs/",meaning:"`phr.` 放行；网开一面；免予追究",usage:"⭐**熟词生义**：`give a pass to sb.`（对某人网开一面/直接放过）。原文：`giving a pass to students who do not do their homework`（对不交作业的学生直接放行免责）。",memory:"画面联想：`pass` 是“通行证/放行条”，老师直接给你一张免死通行证 → **网开一面、放过一马**。",secondary:true},
            {id:"2012-T1-11",word:"implication",ipa:"/ˌɪmplɪˈkeɪʃn/",meaning:"`n.` 暗示；言外之意；可能后果",usage:"`close to the implication that...`（接近于暗示……）。原文：如果给不做作业的学生放行，就危险地接近于暗示要对穷孩子降低标准。",memory:"词族：动词 **`imply`**（暗示，推断题最高频词根：`im-` 向内 + `ply` 折叠 → 叠在里面的话 → **言外之意、暗示**）。",secondary:false},
            {id:"2012-T1-12",word:"empower",ipa:"/ɪmˈpaʊə(r)/",meaning:"`v.` 赋权；授权；使能够",usage:"`empower sb. to do sth.`（授权某人做某事）。原文：`rather than empowering teachers to find what works best`（没有赋权给老师去寻找最适合学生的方法），第 23 题选项 C 正是借此设坑。",memory:"构词极其直观：`em-`（使……获得）+ **`power`（权力/能力）** → **赋权、赋能**。",secondary:false},
            {id:"2012-T1-13",word:"flat",ipa:"/flæt/",meaning:"`adj.` 一刀切的；统一的；固定的",usage:"⭐**熟词生义**：`impose a flat, across-the-board rule`（强加一项“一刀切”的统一规定）。常见作“平的/公寓”，但在政策、价格语境中常指“不分差异、一律相同的”（如 `a flat fee` 一口价）。",memory:"画面记忆：把所有高低不平的个体全压**平（flat）**成一条直线 → **一刀切的、固定不变的**。",secondary:true},
            {id:"2012-T1-14",word:"across-the-board",ipa:"/əˌkrɒs ðə ˈbɔːd/",meaning:"`adj./adv.` 一刀切的；全面无例外的",usage:"`a flat, across-the-board rule`（一刀切的普遍规定）。与 `flat` 构成同义叠用，强调“对所有人/所有情况无差别适用”。",memory:"画面联想：横扫整张棋盘/公告板（`across the board`）不留死角 → **全面地、无一例外地**。",secondary:false},
            {id:"2012-T1-15",word:"thorny",ipa:"/ˈθɔːni/",meaning:"`adj.` 棘手的；难处理的",usage:"`the truly thorny questions`（真正棘手的问题）。第 4 段核心词，也在第 25 题干扰项 C `Thorny Questions about Homework` 中原词重现。",memory:"词根：`thorn`（荆棘、刺）+ `-y` → **长满刺的 → 摸起来扎手 → 棘手的**。",secondary:false},
            {id:"2012-T1-16",word:"eliminate",ipa:"/ɪˈlɪmɪneɪt/",meaning:"`v.` 取消；消除；淘汰",usage:"`reduce or eliminate the assignments`（减少或取消作业）。出现在第 4 段条件句中，并复现于第 24 题选项 A `be eliminated`。",memory:"词根：`e-`（出）+ `limin`（门槛，同 `limit`）+ `-ate` → **赶出门槛之外 → 淘汰、取消**。",secondary:false},
            {id:"2012-T1-17",word:"conversely",ipa:"/ˈkɒnvɜːsli/",meaning:"`adv.` 相反地；反过来",usage:"用于引出与前文截然相反的条件或结果。原文用 `If..., Conversely, if...` 构成正反对比（第 24 题定位核心信号词）。",memory:"词根：`con-`（共同/互相）+ `vers`（转，同 `reverse`）→ **转到反面去 → 相反地**。",secondary:false},
            {id:"2012-T1-18",word:"put on hold",ipa:"/pʊt ɒn həʊld/",meaning:"`v. phr.` 暂缓；搁置",usage:"`be put on hold while...`（在……期间被暂缓执行）。末段作者提出建议：在听证和调研期间，先把这套作业新规搁置。",memory:"画面联想：打电话时按 **`Hold`** 键就是“暂时保持/挂起不处理” → **搁置、暂缓**。",secondary:false},
            {id:"2012-T1-19",word:"undermine",ipa:"/ˌʌndəˈmaɪn/",meaning:"`v.` 暗中破坏；逐渐削弱",usage:"考研选项极高频动词！第 23 题选项 B `undermine the authority of state tests`（削弱州统考的权威性）。常见搭配：`undermine confidence / trust / health`。",memory:"拆分神记忆：**`under`（在下面）+ `mine`（矿井/地雷）** → 在城墙底下悄悄挖地道埋雷 → **暗中破坏、削弱根基**。",secondary:false},
            {id:"2012-T1-20",word:"indifference",ipa:"/ɪnˈdɪfrəns/",meaning:"`n.` 漠不关心；冷漠",usage:"`indifference to sth.`（对某事漠不关心）。第 23 题选项 A `students’ indifference to their report cards`（学生对成绩单漠不关心）；形容词 `indifferent` 也是态度题常客。",memory:"逻辑拆分：`in-`（不）+ `difference`（区别/在意）→ 对好坏都觉得“没区别、无所谓” → **漠不关心**。",secondary:false},
            {id:"2012-T1-21",word:"interpretation",ipa:"/ɪnˌtɜːprɪˈteɪʃn/",meaning:"`n.` 解读；理解；阐释",usage:"第 25 题选项 D `Wrong Interpretations of an Educational Policy`（对某项教育政策的错误解读）。动词 `interpret`（解读、口译）。",memory:"词根：`inter-`（在两者之间）+ `pret`（价格/价值，同 `price`）→ 在两种语言或文字之间解释意思 → **解读、解释**。",secondary:false}
          ]

            {id:"2012-T2-3",word:"intrinsically",ipa:"/ɪnˈtrɪnzɪkli/",meaning:"`adv.` 本质上；内在地",usage:"`It is not that pink is intrinsically bad`（并不是粉色在本质上不好）。常用于让步句，承认事物本身无罪，错在人为包装；同义词即第 3 段的 `inherently`。",memory:"词根：`in-`（内部）+ `trins`（跟随）→ 天生就跟在东西里面的属性 → **本质上、固有地**。",secondary:false},
            {id:"2012-T2-4",word:"fuse",ipa:"/fjuːz/",meaning:"`v.` 融合；将……紧密绑定",usage:"`fuse A to B`（把 A 熔合/绑定到 B 上）。原文：`repeatedly and firmly fuses girls’ identity to appearance.`（反复牢固地把女孩身份与外貌捆绑在一起）。",memory:"联想：物理上的“保险丝”（`fuse`）会熔断、焊接金属 → 引申为把两样东西**熔合、死死绑在一起**。",secondary:false},
            {id:"2012-T2-5",word:"innocence",ipa:"/ˈɪnəsns/",meaning:"`n.` 纯真；天真；无辜",usage:"`evidence of innocence`（纯真的证明）。原文出现 `not only innocent but as evidence of innocence`，并在第 26 题干扰项 B 中复现。",memory:"词根：`in-`（无）+ `noc`（伤害，同 `noxious` 有害的）→ 没有伤害、害不了别人 → **纯真、无辜**。",secondary:false},
            {id:"2012-T2-6",word:"despair",ipa:"/dɪˈspeə(r)/",meaning:"`v.` 绝望；感到无望",usage:"`despair at sth.`（对某事感到绝望）。原文：`I despaired at the singular lack of imagination`（我对这种单一想象力感到绝望），表达作者强烈不满。",memory:"词根：`de-`（向下/否定）+ `spair`（希望，同 `prosper`）→ 希望掉到谷底 → **绝望**。",secondary:false},
            {id:"2012-T2-7",word:"singular",ipa:"/ˈsɪŋɡjələ(r)/",meaning:"`adj.` 突出的；极度的；单一的",usage:"⭐**熟词生义**：`the singular lack of imagination`（令人震惊的/单一性的想象力匮乏）。语法里学过“单数”，阅读中常考“非凡的、极度的、单一的”。",memory:"逻辑记忆：`single`（单一的）→ 唯一到极点、独一份 → **突出的、极度的、单一的**。",secondary:true},
            {id:"2012-T2-8",word:"encode",ipa:"/ɪnˈkəʊd/",meaning:"`v.` 编码；刻入（基因/信息）",usage:"`be encoded in one’s DNA`（刻在 DNA 里/天生注定）。第 2 段先说仿佛刻在 DNA 里，随即用 `but... it is not` 推翻，对应第 27 题 A 排除。",memory:"构词：`en-`（使进入）+ **`code`（密码/代码）** → 把信息编进代码里 → **编码、写入基因**。",secondary:false},
            {id:"2012-T2-9",word:"masculine",ipa:"/ˈmæskjəlɪn/",meaning:"`adj.` 男性的；阳刚的",usage:"`the more masculine colour`（更偏男性的颜色）。原文历史大反转：过去粉色被视为红色的柔和版，象征力量，反而属于**男性色**！",memory:"联想记忆：发音像 **`man` / `muscle`（肌肉）** → 充满肌肉感 → **男性的、阳刚的**。",secondary:false},
            {id:"2012-T2-10",word:"femininity",ipa:"/ˌfeməˈnɪnəti/",meaning:"`n.` 女性气质；阴柔美",usage:"`symbolised femininity`（象征女性特质）。第 27 题 B 正确定位句：`Blue... symbolised femininity` → 同义改写为 `the colour for girls`。",memory:"词根：`fem`（女人，同 `female`）+ `-inity`（性质）→ **女性气质**（与 `masculine` 一男一女成对背）。",secondary:false},
            {id:"2012-T2-11",word:"constancy",ipa:"/ˈkɒnstənsi/",meaning:"`n.` 忠贞；坚定不移；恒常",usage:"`intimations of the Virgin Mary, constancy and faithfulness`（象征圣母玛利亚、忠贞与忠诚）。",memory:"词族：来自 **`constant`**（不断的、忠实的）→ 一直保持不变的感情/态度 → **恒常、忠贞**。",secondary:false},
            {id:"2012-T2-12",word:"come into one’s own",ipa:"/kʌm ˈɪntuː wʌnz əʊn/",meaning:"`phr.` 大行其道；充分展示魅力",usage:"`pink fully came into its own`（粉色才真正独占鳌头/大放异彩）。前面加 `It was not until the mid-1980s... that...` 强调句，是历史转折时间节点。",memory:"字面画面：终于走进了“属于它自己的主场” → **大显身手、大行其道**。",secondary:false},
            {id:"2012-T2-13",word:"inherently",ipa:"/ɪnˈherəntli/",meaning:"`adv.` 内在地；天生地；固有地",usage:"`seem inherently attractive to girls`（看起来似乎天生对女孩有吸引力）。与第 1 段的 `intrinsically`、选项的 `inborn` 属于同义词群。",memory:"词根：`in-`（在里面）+ `her`（黏附，同 `adhere` 黏附）→ 一出生就黏在里面的 → **天生地、固有的**。",secondary:false},
            {id:"2012-T2-14",word:"dictate",ipa:"/ˈdɪkteɪt/",meaning:"`v.` 支配；决定；主宰",usage:"⭐**熟词生义**：`dictate our perception`（支配/左右我们的认知）。别只记“听写”！第 28 题把 `dictated` 直接同义替换成了 `was much influenced by`。",memory:"联想记忆：领导口授（`dictate`）命令让下属照做 → 引申为**发号施令、支配、决定**。",secondary:true},
            {id:"2012-T2-15",word:"perception",ipa:"/pəˈsepʃn/",meaning:"`n.` 认知；观念；看法",usage:"`our perception of what is natural to kids`（我们对什么是儿童天性的认知）。第 28 题题干原词重现。",memory:"词根：`per-`（完全）+ `cept`（抓，同 `accept`）→ 脑子把外界信息抓进来形成理解 → **认知、看法**。",secondary:false},
            {id:"2012-T2-16",word:"popularise",ipa:"/ˈpɒpjələraɪz/",meaning:"`v.` 推广；普及；使流行",usage:"`be popularised as a marketing trick`（被当作一种营销伎俩推广开来）。英式拼写 `-ise`，美式为 `-ize`。",memory:"构词：**`popular`（流行的）** + `-ise`（使……）→ **使流行、普及、推广**。",secondary:false},
            {id:"2012-T2-17",word:"counsel",ipa:"/ˈkaʊnsl/",meaning:"`v.` 建议；劝告；指导",usage:"⭐**熟词生义**：`counsel sb. that...`（建议某人……）。原文：`Trade publications counselled department stores that...`，第 29 题题干直接同义替换为 `were advised to`。",memory:"联想记忆：学校/心理老师叫 `counselor`（辅导员/顾问），动词就是**给出建议、劝告**（注意区别 `council` 委员会）。",secondary:true},
            {id:"2012-T2-18",word:"evolve",ipa:"/ɪˈvɒlv/",meaning:"`v.` 演变；逐步发展（成）",usage:"`evolve into...`（演变成……）。原文：先变成常见购物词汇，之后才 `evolved into a broadly accepted developmental stage`（演变成公认的发育阶段）。",memory:"词根：`e-`（向外）+ `volv`（滚动，同 `revolve`）→ 像滚雪球一样滚大变样 → **演变、进化**。",secondary:false},
            {id:"2012-T2-19",word:"segment",ipa:"/ˈseɡmənt/",meaning:"`v.` 细分，分割；`n.` 部分",usage:"`segment a market`（细分市场）。对应前句 `Splitting kids... into ever-tinier categories`，以及第 29 题正确项 A `classify consumers into smaller groups`。",memory:"词根：`seg`（切，同 `section` 部分）+ `-ment` → 切出来的一块 → **部分；细分、分割**。",secondary:false},
            {id:"2012-T2-20",word:"magnify",ipa:"/ˈmæɡnɪfaɪ/",meaning:"`v.` 放大；夸大",usage:"`magnify gender differences`（放大性别差异）。与第 3 段的 `amplify`（放大）呼应，说明商家靠放大男女差异赚钱。",memory:"词根：`magn`（大，同 `magnificent` 宏伟的）+ `-ify`（使……）→ **使变大 → 放大、夸大**。",secondary:false},

            {id:"2012-T3-5",word:"assure",ipa:"/əˈʃʊə(r)/",meaning:"`v.` 向……保证；安抚使放心",usage:"`assure sb. that...`（向某人保证……）。原文行业组织 BIO 安抚成员这只是漫长战役的第一步，第 31 题选项 B 却偷换成 `issue a warning`（发警告）。",memory:"拆分：`as-`（一再）+ **`sure`（确定）** → 一再对你说“稳的、放心” → **向某人保证、安抚**。",secondary:false},
            {id:"2012-T3-6",word:"preliminary",ipa:"/prɪˈlɪmɪnəri/",meaning:"`adj.` 初步的；预备的",usage:"`a “preliminary step” in a longer battle`（一场更持久战中的“初步一步”）。常见搭配：`preliminary results / findings`（初步结果）。",memory:"词根：`pre-`（提前、在前）+ `limin`（门槛）→ 还没跨过正式门槛、在门前先走的一步 → **初步的、预备的**。",secondary:false},

          if (state.statusFilter === "unmastered" && isMastered(w.id)) return false;
          if (state.statusFilter === "hard" && !isHard(w.id)) return false;
          if (state.statusFilter === "mastered" && !isMastered(w.id)) return false;
          if (q && !`${w.word} ${w.meaning} ${w.usage} ${w.memory}`.toLowerCase().includes(q)) return false;
          return true;
        });
      };
      const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      const fmt = s => esc(s).replace(/`([^`]+)`/g,'<span class="inline-en">$1</span>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
      const fmtM = s => esc(s).replace(/`([^`]+)`/g,'<span class="pos-tag">$1</span>');
      let toastT;
      const toast = msg => { const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800); };
      const speak = w => { if (!("speechSynthesis" in window)) return toast("当前浏览器不支持语音朗读"); try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = "en-US"; u.rate = 0.92; speechSynthesis.speak(u); } catch (_) {} };
      const syncOrder = (shuffle = false) => {
        const ids = filteredWords().map(w => w.id);
        if (shuffle) for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
        state.fcOrder = ids; state.fcIndex = 0; state.fcFlipped = false;
      };
      const resetFilters = () => { state.passage = "ALL"; state.statusFilter = "all"; state.secondaryOnly = false; state.search = ""; document.getElementById("searchInput").value = ""; syncOrder(false); render(); };
      function renderProgress() {
        const list = allWords(), t = list.length, m = list.filter(w => isMastered(w.id)).length, h = list.filter(w => isHard(w.id)).length, pct = t ? Math.round(m / t * 100) : 0;
        document.getElementById("statTotal").textContent = t; document.getElementById("statMastered").textContent = m; document.getElementById("statHard").textContent = h; document.getElementById("statRemain").textContent = t - m;
        document.getElementById("progressPct").textContent = pct + "%"; document.getElementById("progressBarFill").style.width = pct + "%";
      }
      function renderTabs() {
        const el = document.getElementById("passageTabs"); el.innerHTML = "";
        [{ id: "ALL", label: "全部篇目", count: allWords().length }, ...VOCAB_DATA.passages.map(p => ({ id: p.id, label: `${p.code} · ${p.title}`, count: p.words.length }))].forEach(t => {
          const b = document.createElement("button"); b.type = "button"; b.className = `tab-btn ${state.passage === t.id ? "active" : ""}`;
          b.innerHTML = `<span>${esc(t.label)}</span><span style="font-size:11px;opacity:.8">${t.count}</span>`;
          b.onclick = () => { state.passage = t.id; syncOrder(false); render(); }; el.appendChild(b);
        });
      }
      function renderMain() {
        const list = filteredWords(), box = document.getElementById("mainContent");
        box.className = state.mode === "list" && state.compactMode ? "details-hidden" : "";
        box.innerHTML = "";
        if (state.mode === "flashcard") {
          const map = new Map(list.map(w => [w.id, w]));
          let ids = state.fcOrder.filter(id => map.has(id));
          if (!ids.length && list.length) { syncOrder(false); ids = state.fcOrder.filter(id => map.has(id)); }
          if (!ids.length) { box.innerHTML = `<div class="empty-state"><h3>这一组词已刷完 🎉</h3><p>切换筛选或复刷「★ 易忘」钉子户。</p><button type="button" class="btn-primary" id="rstBtn">显示全部</button></div>`; document.getElementById("rstBtn").onclick = resetFilters; return; }
          if (state.fcIndex >= ids.length) state.fcIndex = 0;
          const item = map.get(ids[state.fcIndex]);
          box.innerHTML = `<div class="flashcard-wrap"><div class="fc-top"><span>闪卡进度：<strong>${state.fcIndex+1} / ${ids.length}</strong></span><div style="display:flex;gap:8px"><button type="button" class="icon-btn" id="fcPrev">← 上一词</button><button type="button" class="icon-btn" id="fcShuf">🔀 乱序</button></div></div><div class="flashcard"><div class="fc-front"><div class="fc-passage">${esc(item.passageCode)} · ${esc(item.passageTitle)}${item.secondary?" · ⭐ 熟词生义":""}</div><h2 class="fc-word">${esc(item.word)}</h2><div class="fc-ipa-row"><span class="word-ipa">${esc(item.ipa)}</span><button type="button" class="speak-btn" id="fcSpk">🔊</button></div>${!state.fcFlipped?'<div><button type="button" class="fc-hint-btn" id="fcFlip">点击查看释义与记忆法</button></div>':""}</div>${state.fcFlipped?`<div class="fc-back"><div class="meaning-box" style="margin-bottom:0"><div>${fmtM(item.meaning)}</div></div><div class="detail-block"><span class="detail-label">真题详细用法与考法</span><div>${fmt(item.usage)}</div></div><div class="detail-block memory"><span class="detail-label">记忆方法 · 词根 / 联想</span><div>${fmt(item.memory)}</div></div><div class="fc-actions"><button type="button" class="fc-rate-btn forgot" id="fc1">忘了 · 标易忘</button><button type="button" class="fc-rate-btn fuzzy" id="fc2">模糊 · 下一词</button><button type="button" class="fc-rate-btn know" id="fc3">秒懂 · 已掌握</button></div></div>`:""}</div><div class="fc-kbd">电脑端快捷键：空格键翻面 · 1 忘了 · 2 模糊 · 3 秒懂</div></div>`;
          document.getElementById("fcSpk").onclick = () => speak(item.word);
          document.getElementById("fcPrev").onclick = () => { state.fcIndex = (state.fcIndex - 1 + ids.length) % ids.length; state.fcFlipped = false; renderMain(); };
          document.getElementById("fcShuf").onclick = () => { syncOrder(true); toast("已打乱当前闪卡顺序"); renderMain(); };
          if (document.getElementById("fcFlip")) document.getElementById("fcFlip").onclick = () => { state.fcFlipped = true; renderMain(); };
          if (document.getElementById("fc1")) {
            document.getElementById("fc1").onclick = () => { toggleHard(item.id, true); toast("已加入 ★ 易忘"); state.fcIndex = (state.fcIndex + 1) % ids.length; state.fcFlipped = false; render(); };
            document.getElementById("fc2").onclick = () => { state.fcIndex = (state.fcIndex + 1) % ids.length; state.fcFlipped = false; render(); };
            document.getElementById("fc3").onclick = () => { toggleMastered(item.id, true); toast("已标记 ✓ 掌握"); if (state.statusFilter !== "unmastered") state.fcIndex = (state.fcIndex + 1) % ids.length; state.fcFlipped = false; render(); };
          }
          return;
        }
        if (!list.length) { box.innerHTML = `<div class="empty-state"><h3>当前筛选下没有单词</h3><p>换个筛选或清空搜索词试试。</p><button type="button" class="btn-primary" id="rstBtn">恢复显示全部</button></div>`; document.getElementById("rstBtn").onclick = resetFilters; return; }
        VOCAB_DATA.passages.forEach(p => {
          const pw = list.filter(w => w.passageId === p.id); if (!pw.length) return;
          const sec = document.createElement("section"); sec.className = "passage-section";
          sec.innerHTML = `<div class="passage-header"><h2 class="passage-title"><span class="passage-code">${esc(p.code)}</span><span>${esc(p.title)}</span></h2><span class="passage-meta">显示 ${pw.length} 词 · 已掌握 ${pw.filter(w=>isMastered(w.id)).length}</span></div>`;
          const wl = document.createElement("div"); wl.className = "word-list";
          pw.forEach(item => {
            const m = isMastered(item.id), h = isHard(item.id), masked = state.maskMeaning && !state.revealedIds.has(item.id);
            const card = document.createElement("article"); card.className = `word-card ${m?"is-mastered":""} ${h?"is-hard":""}`;
            card.innerHTML = `<div class="card-head"><div class="word-identity"><span class="word-text">${esc(item.word)}</span><span class="word-ipa">${esc(item.ipa)}</span><button type="button" class="speak-btn" title="朗读">🔊</button>${item.secondary?'<span class="badge-sec">⭐ 熟词生义</span>':""}</div><div class="card-actions"><button type="button" class="action-pill ${h?"hard-active":""}" data-a="h">${h?"★ 已标易忘":"☆ 标易忘"}</button><button type="button" class="action-pill ${m?"master-active":""}" data-a="m">${m?"✓ 已掌握":"○ 标掌握"}</button></div></div><div class="meaning-box ${masked?"masked":""}" data-a="p">${masked?"<span>点击偷看本文词义</span><span>Tap</span>":`<div>${fmtM(item.meaning)}</div>`}</div><div class="card-details"><div class="detail-block"><span class="detail-label">真题详细用法与考法</span><div>${fmt(item.usage)}</div></div><div class="detail-block memory"><span class="detail-label">记忆方法 · 词根 / 联想</span><div>${fmt(item.memory)}</div></div></div>`;
            card.querySelector(".speak-btn").onclick = () => speak(item.word);
            card.querySelector('[data-a="h"]').onclick = () => { toggleHard(item.id); render(); };
            card.querySelector('[data-a="m"]').onclick = () => { toggleMastered(item.id); render(); };
            card.querySelector('[data-a="p"]').onclick = () => { if (!state.maskMeaning) return; state.revealedIds.has(item.id) ? state.revealedIds.delete(item.id) : state.revealedIds.add(item.id); renderMain(); };
            wl.appendChild(card);
          });
          sec.appendChild(wl); box.appendChild(sec);
        });
      }
      function render() {
        renderProgress(); renderTabs();
        document.querySelectorAll("[data-status]").forEach(b => b.classList.toggle("active", b.getAttribute("data-status") === state.statusFilter));
        document.getElementById("secondaryBtn").classList.toggle("active", state.secondaryOnly);
        document.getElementById("maskBtn").classList.toggle("active", state.maskMeaning);
        document.getElementById("maskBtn").textContent = state.maskMeaning ? "👁 已遮住词义" : "🙈 遮住词义自测";
        document.getElementById("compactBtn").classList.toggle("active", state.compactMode);
        document.getElementById("compactBtn").textContent = state.compactMode ? "展开用法与记忆" : "精简刷词视图";
        document.getElementById("modeListBtn").classList.toggle("active", state.mode === "list");
        document.getElementById("modeFlashBtn").classList.toggle("active", state.mode === "flashcard");
        document.getElementById("maskBtn").classList.toggle("hidden", state.mode === "flashcard");
        document.getElementById("compactBtn").classList.toggle("hidden", state.mode === "flashcard");
        renderMain();
      }
      const updateTheme = () => { const d = document.documentElement.getAttribute("data-theme") === "dark"; document.getElementById("themeBtn").textContent = d ? "☀ 浅色" : "☾ 夜间"; };
      const savedT = localStorage.getItem(THEME_KEY);
      if (savedT === "dark" || savedT === "light") document.documentElement.setAttribute("data-theme", savedT);
      updateTheme();
      document.getElementById("themeBtn").onclick = () => { const n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem(THEME_KEY, n); } catch (_) {} updateTheme(); };
      document.getElementById("modeListBtn").onclick = () => { state.mode = "list"; render(); };
      document.getElementById("modeFlashBtn").onclick = () => { state.mode = "flashcard"; syncOrder(false); render(); };
      document.querySelectorAll("[data-status]").forEach(b => { b.onclick = () => { state.statusFilter = b.getAttribute("data-status"); syncOrder(false); render(); }; });
      document.getElementById("secondaryBtn").onclick = () => { state.secondaryOnly = !state.secondaryOnly; syncOrder(false); render(); };
      document.getElementById("maskBtn").onclick = () => { state.maskMeaning = !state.maskMeaning; state.revealedIds.clear(); render(); };
      document.getElementById("compactBtn").onclick = () => { state.compactMode = !state.compactMode; render(); };
      document.getElementById("searchInput").oninput = e => { state.search = e.target.value; syncOrder(false); renderMain(); };
      document.addEventListener("keydown", e => {
        if (state.mode !== "flashcard" || ["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
        if (e.code === "Space") { e.preventDefault(); if (!state.fcFlipped) { state.fcFlipped = true; renderMain(); } }
        else if (state.fcFlipped && ["1","2","3"].includes(e.key)) { const btn = document.getElementById("fc" + e.key); if (btn) btn.click(); }
      });
      const sm = document.getElementById("syncModal"), st = document.getElementById("syncTextarea");
      document.getElementById("syncBtn").onclick = () => { st.value = JSON.stringify(state.progress); sm.classList.add("open"); };
      document.getElementById("closeSyncBtn").onclick = () => sm.classList.remove("open");
      sm.onclick = e => { if (e.target === sm) sm.classList.remove("open"); };
      document.getElementById("copySyncBtn").onclick = async () => { try { await navigator.clipboard.writeText(st.value); toast("进度码已复制"); } catch (_) { st.select(); document.execCommand("copy"); toast("进度码已复制"); } };
      document.getElementById("importSyncBtn").onclick = () => { try { const p = JSON.parse(st.value.trim()); if (!Array.isArray(p.mastered) || !Array.isArray(p.hard)) throw 0; state.progress = { mastered: [...new Set(p.mastered)], hard: [...new Set(p.hard)] }; saveProgress(); sm.classList.remove("open"); toast("进度已导入"); render(); } catch (_) { toast("JSON 格式不正确"); } };
      document.getElementById("resetProgressBtn").onclick = () => { if (!confirm("确定清空所有已掌握与易忘标记吗？")) return; state.progress = { mastered: [], hard: [] }; saveProgress(); sm.classList.remove("open"); toast("进度已重置"); render(); };
      syncOrder(false); render();
    })();
  </script>
</body>
</html>
